#Server

server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:200}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:20}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:200}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:8192}

#DATASOURCE
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.validation-timeout=${HIKARI_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION_THRESHOLD_MS:20000}

spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

#Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

app.jwt.secret=${JWT_SECRET}
app.frontend-base-url=${APP_FRONTEND_BASE_URL}
app.email-verification.token-expiry-minutes=${EMAIL_VERIFICATION_TOKEN_EXPIRY_MINUTES:60}
rate-limit.max-entries=${RATE_LIMIT_MAX_ENTRIES:50000}
file-upload.max-tracked-files=${FILE_UPLOAD_MAX_TRACKED_FILES:5000}
app.async.defaults.core-pool-size=${ASYNC_DEFAULT_CORE_POOL_SIZE:8}
app.async.defaults.max-pool-size=${ASYNC_DEFAULT_MAX_POOL_SIZE:16}
app.async.defaults.queue-capacity=${ASYNC_DEFAULT_QUEUE_CAPACITY:200}
app.async.mail.core-pool-size=${ASYNC_MAIL_CORE_POOL_SIZE:2}
app.async.mail.max-pool-size=${ASYNC_MAIL_MAX_POOL_SIZE:8}
app.async.mail.queue-capacity=${ASYNC_MAIL_QUEUE_CAPACITY:200}
app.async.audit.core-pool-size=${ASYNC_AUDIT_CORE_POOL_SIZE:4}
app.async.audit.max-pool-size=${ASYNC_AUDIT_MAX_POOL_SIZE:8}
app.async.audit.queue-capacity=${ASYNC_AUDIT_QUEUE_CAPACITY:1000}
app.async.shutdown-await-seconds=${ASYNC_SHUTDOWN_AWAIT_SECONDS:30}
scheduling.thread-pool-size=${SCHEDULING_THREAD_POOL_SIZE:4}
scheduling.shutdown-await-seconds=${SCHEDULING_SHUTDOWN_AWAIT_SECONDS:30}
logging.level.root=WARN
logging.level.com.akash.pooler_backend=INFO

# Profile media S3 upload
profile-media.s3-bucket=${PROFILE_MEDIA_S3_BUCKET}
profile-media.s3-region=${PROFILE_MEDIA_S3_REGION:ap-southeast-1}
profile-media.key-prefix=${PROFILE_MEDIA_KEY_PREFIX:hoppo/profile-media/prod}
profile-media.public-base-url=${PROFILE_MEDIA_PUBLIC_BASE_URL:}
profile-media.max-size-mb=${PROFILE_MEDIA_MAX_SIZE_MB:5}
