#Server

server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

#DATASOURCE
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

#Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

app.jwt.secret=${JWT_SECRET}
logging.level.root=WARN
logging.level.com.enterprise.auth=INFO

# Profile media S3 upload
profile-media.s3-bucket=${PROFILE_MEDIA_S3_BUCKET}
profile-media.s3-region=${PROFILE_MEDIA_S3_REGION:ap-southeast-1}
profile-media.key-prefix=${PROFILE_MEDIA_KEY_PREFIX:hubhop/profile-media/prod}
profile-media.public-base-url=${PROFILE_MEDIA_PUBLIC_BASE_URL:}
profile-media.max-size-mb=${PROFILE_MEDIA_MAX_SIZE_MB:5}
