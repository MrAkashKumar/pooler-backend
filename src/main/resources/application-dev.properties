server.port=${SERVER_PORT:8888}
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:80}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:5}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:50}

#Datasource
spring.datasource.url=jdbc:h2:mem:authdb_dev;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION_THRESHOLD_MS:0}

#H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

#Mail
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME:dev}
spring.mail.password=${MAIL_PASSWORD:dev}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:2000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:2000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:2000}

app.jwt.access-token-expiry-ms=3600000
app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
app.security.bcrypt-strength=4
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:8081}
app.email-verification.token-expiry-minutes=${EMAIL_VERIFICATION_TOKEN_EXPIRY_MINUTES:60}
rate-limit.max-entries=${RATE_LIMIT_MAX_ENTRIES:2000}
file-upload.max-tracked-files=${FILE_UPLOAD_MAX_TRACKED_FILES:200}
app.async.defaults.core-pool-size=${ASYNC_DEFAULT_CORE_POOL_SIZE:2}
app.async.defaults.max-pool-size=${ASYNC_DEFAULT_MAX_POOL_SIZE:4}
app.async.defaults.queue-capacity=${ASYNC_DEFAULT_QUEUE_CAPACITY:50}
app.async.mail.core-pool-size=${ASYNC_MAIL_CORE_POOL_SIZE:1}
app.async.mail.max-pool-size=${ASYNC_MAIL_MAX_POOL_SIZE:2}
app.async.mail.queue-capacity=${ASYNC_MAIL_QUEUE_CAPACITY:25}
app.async.audit.core-pool-size=${ASYNC_AUDIT_CORE_POOL_SIZE:1}
app.async.audit.max-pool-size=${ASYNC_AUDIT_MAX_POOL_SIZE:2}
app.async.audit.queue-capacity=${ASYNC_AUDIT_QUEUE_CAPACITY:100}
app.async.notification.core-pool-size=${ASYNC_NOTIFICATION_CORE_POOL_SIZE:1}
app.async.notification.max-pool-size=${ASYNC_NOTIFICATION_MAX_POOL_SIZE:2}
app.async.notification.queue-capacity=${ASYNC_NOTIFICATION_QUEUE_CAPACITY:50}
chat.cleanup-batch-size=${CHAT_CLEANUP_BATCH_SIZE:50}
scheduling.thread-pool-size=${SCHEDULING_THREAD_POOL_SIZE:2}
scheduling.shutdown-await-seconds=${SCHEDULING_SHUTDOWN_AWAIT_SECONDS:20}

logging.level.com.akash.pooler_backend=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
app.logging.path=${LOG_PATH:./logs}
app.logging.level=${APP_LOG_LEVEL:INFO}
app.logging.archive.max-file-size=${LOG_ARCHIVE_MAX_FILE_SIZE:50MB}
app.logging.archive.max-history-hours=${LOG_ARCHIVE_MAX_HISTORY_HOURS:720}
app.logging.archive.total-size-cap=${LOG_ARCHIVE_TOTAL_SIZE_CAP:1GB}


server.error.include-stacktrace=never
server.error.include-message=never

# Profile media S3 upload
profile-media.s3-bucket=
profile-media.s3-region=ap-southeast-1
profile-media.key-prefix=hoppo/profile-media/dev
profile-media.public-base-url=
profile-media.max-size-mb=5
