#server
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:120}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:10}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}

#Datasource
spring.datasource.url=jdbc:h2:file:./data/authdb_staging;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.validation-timeout=${HIKARI_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION_THRESHOLD_MS:20000}

#H2 Console
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

#Mail
spring.mail.host=${MAIL_HOST:smtp.sendgrid.net}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

logging.level.com.akash.pooler_backend=INFO
logging.level.org.springframework.security=WARN
app.logging.path=${LOG_PATH:./logs}
app.logging.level=${APP_LOG_LEVEL:INFO}
app.logging.archive.max-file-size=${LOG_ARCHIVE_MAX_FILE_SIZE:100MB}
app.logging.archive.max-history-hours=${LOG_ARCHIVE_MAX_HISTORY_HOURS:720}
app.logging.archive.total-size-cap=${LOG_ARCHIVE_TOTAL_SIZE_CAP:3GB}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:https://staging.hoppo.app}
app.jwt.secret=${JWT_SECRET}
app.email-verification.token-expiry-minutes=${EMAIL_VERIFICATION_TOKEN_EXPIRY_MINUTES:60}
rate-limit.max-entries=${RATE_LIMIT_MAX_ENTRIES:10000}
file-upload.max-tracked-files=${FILE_UPLOAD_MAX_TRACKED_FILES:1000}
app.async.defaults.core-pool-size=${ASYNC_DEFAULT_CORE_POOL_SIZE:4}
app.async.defaults.max-pool-size=${ASYNC_DEFAULT_MAX_POOL_SIZE:8}
app.async.defaults.queue-capacity=${ASYNC_DEFAULT_QUEUE_CAPACITY:100}
app.async.mail.core-pool-size=${ASYNC_MAIL_CORE_POOL_SIZE:2}
app.async.mail.max-pool-size=${ASYNC_MAIL_MAX_POOL_SIZE:4}
app.async.mail.queue-capacity=${ASYNC_MAIL_QUEUE_CAPACITY:100}
app.async.audit.core-pool-size=${ASYNC_AUDIT_CORE_POOL_SIZE:2}
app.async.audit.max-pool-size=${ASYNC_AUDIT_MAX_POOL_SIZE:4}
app.async.audit.queue-capacity=${ASYNC_AUDIT_QUEUE_CAPACITY:300}
scheduling.thread-pool-size=${SCHEDULING_THREAD_POOL_SIZE:2}
scheduling.shutdown-await-seconds=${SCHEDULING_SHUTDOWN_AWAIT_SECONDS:30}

# Profile media S3 upload
profile-media.s3-bucket=${PROFILE_MEDIA_S3_BUCKET:}
profile-media.s3-region=${PROFILE_MEDIA_S3_REGION:ap-southeast-1}
profile-media.key-prefix=${PROFILE_MEDIA_KEY_PREFIX:hoppo/profile-media/staging}
profile-media.public-base-url=${PROFILE_MEDIA_PUBLIC_BASE_URL:}
profile-media.max-size-mb=${PROFILE_MEDIA_MAX_SIZE_MB:5}
