server.port=8888
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:120}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:10}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:8192}

spring.messages.encoding=UTF-8
spring.application.name=pooler-backend
server.servlet.contextPath=/pooler-backend

#DATA-SOURCE
spring.datasource.url = jdbc:h2:mem:poolerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username =sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.validation-timeout=${HIKARI_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION_THRESHOLD_MS:0}

#H2 Console
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

#hibernate/JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.transaction.default-timeout=${TRANSACTION_DEFAULT_TIMEOUT_SECONDS:30}

#Mail Sender
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}


#Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false


#Security
app.jwt.session-validity-seconds= 900
app.jwt.refresh-validity-seconds= 2592000

cors.allowed-headers=content-type,x-page-number,x-page-size

#spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP_UTC

app.name=Hoppo
app.version=1.0.0
app.base-url=${APP_BASE_URL:http://localhost:8888/pooler-backend}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:8081}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY:900000}
app.jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY:604800000}
app.jwt.session-token-expiry-ms=${JWT_SESSION_EXPIRY:1800000}
app.jwt.issuer=pooler-auth
app.jwt.audience=pooler-mobile-app
app.password-reset.token-expiry-minutes=30
app.password-reset.max-attempts=3
app.email-verification.token-expiry-minutes=60
app.invitation.default-ttl-seconds=${INVITATION_DEFAULT_TTL_SECONDS:300}
app.invitation.decline-retry-lock-hours=${INVITATION_DECLINE_RETRY_LOCK_HOURS:8}
app.mail.from=${MAIL_FROM:noreply@hoppo.io}
app.mail.from-name=${MAIL_FROM_NAME:Hoppo Auth}
app.security.max-failed-attempts=5
app.security.lock-duration-minutes=30
app.security.bcrypt-strength=12
app.auth.google.client-ids=${GOOGLE_CLIENT_IDS:}
app.auth.google.token-info-url=${GOOGLE_TOKEN_INFO_URL:https://oauth2.googleapis.com/tokeninfo}
app.auth.google.request-timeout-seconds=${GOOGLE_TOKEN_INFO_REQUEST_TIMEOUT_SECONDS:5}
app.auth.google.connect-timeout-seconds=${GOOGLE_TOKEN_INFO_CONNECT_TIMEOUT_SECONDS:3}
app.auth.apple.client-ids=${APPLE_CLIENT_IDS:}
app.auth.apple.issuer=${APPLE_ISSUER:https://appleid.apple.com}
app.auth.apple.jwks-url=${APPLE_JWKS_URL:https://appleid.apple.com/auth/keys}
app.auth.apple.request-timeout-seconds=${APPLE_JWKS_REQUEST_TIMEOUT_SECONDS:5}
app.auth.apple.connect-timeout-seconds=${APPLE_JWKS_CONNECT_TIMEOUT_SECONDS:3}
app.auth.apple.jwks-cache-minutes=${APPLE_JWKS_CACHE_MINUTES:60}
app.auth.apple.allowed-clock-skew-seconds=${APPLE_TOKEN_ALLOWED_CLOCK_SKEW_SECONDS:60}
app.security.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*,http://10.0.2.2:*,capacitor://localhost,ionic://localhost}
app.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD

rate-limit.max-entries=${RATE_LIMIT_MAX_ENTRIES:10000}
rate-limit.cleanup-interval-seconds=${RATE_LIMIT_CLEANUP_INTERVAL_SECONDS:60}

# Logging archive policy. Hourly compressed archives older than 720 hours/30 days are removed.
app.logging.path=${LOG_PATH:./logs}
app.logging.level=${APP_LOG_LEVEL:INFO}
app.logging.archive.max-file-size=${LOG_ARCHIVE_MAX_FILE_SIZE:100MB}
app.logging.archive.max-history-hours=${LOG_ARCHIVE_MAX_HISTORY_HOURS:720}
app.logging.archive.total-size-cap=${LOG_ARCHIVE_TOTAL_SIZE_CAP:3GB}

# Async executor pools. Keep queues bounded to avoid memory growth under load.
app.async.defaults.core-pool-size=${ASYNC_DEFAULT_CORE_POOL_SIZE:4}
app.async.defaults.max-pool-size=${ASYNC_DEFAULT_MAX_POOL_SIZE:8}
app.async.defaults.queue-capacity=${ASYNC_DEFAULT_QUEUE_CAPACITY:100}
app.async.defaults.keep-alive-seconds=${ASYNC_DEFAULT_KEEP_ALIVE_SECONDS:60}
app.async.mail.core-pool-size=${ASYNC_MAIL_CORE_POOL_SIZE:2}
app.async.mail.max-pool-size=${ASYNC_MAIL_MAX_POOL_SIZE:6}
app.async.mail.queue-capacity=${ASYNC_MAIL_QUEUE_CAPACITY:100}
app.async.mail.keep-alive-seconds=${ASYNC_MAIL_KEEP_ALIVE_SECONDS:60}
app.async.audit.core-pool-size=${ASYNC_AUDIT_CORE_POOL_SIZE:2}
app.async.audit.max-pool-size=${ASYNC_AUDIT_MAX_POOL_SIZE:4}
app.async.audit.queue-capacity=${ASYNC_AUDIT_QUEUE_CAPACITY:500}
app.async.audit.keep-alive-seconds=${ASYNC_AUDIT_KEEP_ALIVE_SECONDS:30}
app.async.notification.core-pool-size=${ASYNC_NOTIFICATION_CORE_POOL_SIZE:2}
app.async.notification.max-pool-size=${ASYNC_NOTIFICATION_MAX_POOL_SIZE:6}
app.async.notification.queue-capacity=${ASYNC_NOTIFICATION_QUEUE_CAPACITY:200}
app.async.notification.keep-alive-seconds=${ASYNC_NOTIFICATION_KEEP_ALIVE_SECONDS:60}
app.async.shutdown-await-seconds=${ASYNC_SHUTDOWN_AWAIT_SECONDS:30}


# Admin monitoring. These endpoints are not called by the mobile app.
# Spring Security restricts /actuator/** to ROLE_ADMIN.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN

 # ------------------------ Spring-doc / OpenAPI --------------------------------
# Effective URLs (note: context path /pooler-backend is auto-prepended by the servlet container):
#   Swagger UI  : http://localhost:8888/pooler-backend/swagger-ui/index.html
#   OpenAPI JSON: http://localhost:8888/pooler-backend/v3/api-docs
#   OpenAPI YAML: http://localhost:8888/pooler-backend/v3/api-docs.yaml
#   Api-docs:   http://localhost:8888/pooler-backend/v3/api-docs/00-all

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-operation-id=false
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.default-model-expand-depth=2
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.show-actuator=false
springdoc.writer-with-default-pretty-printer=true
springdoc.packages-to-scan=com.akash.pooler_backend.controller
springdoc.paths-to-match=/api/v1/**,/api/v2/**

# Additional CORS settings for Swagger UI
springdoc.swagger-ui.csrf.enabled=false
springdoc.swagger-ui.supported-submit-methods=get,post,put,delete,patch,options,head

# ?????????????????????????????????????????????????????????????????
# Chat & Messaging Configuration
# ?????????????????????????????????????????????????????????????????


# Chat expiration and lifecycle
chat.expiration-hours=2
chat.message-edit-window-minutes=15
chat.rate-limit-messages-per-minute=10
chat.cleanup-interval-minutes=10
chat.cleanup-batch-size=${CHAT_CLEANUP_BATCH_SIZE:100}

# File upload configuration
file-upload.max-size-mb=10
file-upload.expiration-hours=2
file-upload.max-tracked-files=${FILE_UPLOAD_MAX_TRACKED_FILES:1000}
file-upload.storage-type=local
file-upload.storage-path=/tmp/chat-files

# Search and indexing configuration
search.enabled=true
search.index-before-archival=true

# WebSocket configuration
websocket.max-connections-per-thread=2
websocket.message-size-limit=65536
websocket.allowed-origins=http://localhost:8080,http://localhost:3000,http://localhost:8888
websocket.session-timeout-minutes=120

# Task scheduler configuration
scheduling.enabled=true
scheduling.thread-pool-size=2
scheduling.shutdown-await-seconds=30
