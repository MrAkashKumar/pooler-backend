# Datasource
spring.datasource.url = jdbc:h2:mem:poolerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username =sa
spring.datasource.password=

#H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#hibernate/JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

#Mail Sender
spring.mail.host= smtp.gmail.com
spring.mail.port=587
spring.mail.username= dev@pooler.com
spring.mail.password=

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


#Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false


#logging.config=file:/etc/.files/pooler-logback.xml

#Security
#app.jwt.secret= ABciw0203WIJPKA0294
app.jwt.session-validity-seconds= 900
app.jwt.refresh-validity-seconds= 2592000

cors.allowed-headers=content-type,x-page-number,x-page-size

#spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP_UTC

app.name=Pooler Service
app.version=1.0.0
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.jwt.secret=${JWT_SECRET:5A7134743777217A25432A462D4A614E645267556B58703273357638792F423F}
app.jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY:900000}
app.jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY:604800000}
app.jwt.session-token-expiry-ms=${JWT_SESSION_EXPIRY:1800000}
app.jwt.issuer=enterprise-auth
app.jwt.audience=enterprise-mobile-app
app.password-reset.token-expiry-minutes=30
app.password-reset.max-attempts=3
app.mail.from=${MAIL_FROM:noreply@pooler.com}
app.mail.from-name=${MAIL_FROM_NAME:Enterprise Auth}
app.security.max-failed-attempts=5
app.security.lock-duration-minutes=30
app.security.bcrypt-strength=12
app.security.cors.allowed-origins=app.security.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8888,http://localhost:8080,http://localhost:3000,http://127.0.0.1:8888,http://127.0.0.1:8080}
#app.security.cors.allowed-origins=${CORS_ORIGINS:*}
app.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD


#Metrics
management.endpoints.web.exposure.include=health,info,metrics

 # ------------------------ Spring-doc / OpenAPI --------------------------------
# Effective URLs (note: context path /pooler-backend is auto-prepended by the servlet container):
#   Swagger UI  : http://localhost:8888/pooler-backend/swagger-ui/index.html
#   OpenAPI JSON: http://localhost:8888/pooler-backend/v3/api-docs
#   OpenAPI YAML: http://localhost:8888/pooler-backend/v3/api-docs.yaml
#   Api-docs:   http://localhost:8888/pooler-backend/v3/api-docs/00-all

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-operation-id=false
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.default-model-expand-depth=2
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.show-actuator=false
springdoc.writer-with-default-pretty-printer=true
springdoc.packages-to-scan=com.akash.pooler_backend.controller
springdoc.paths-to-match=/api/v1/**,/api/v2/**

# Additional CORS settings for Swagger UI
springdoc.swagger-ui.csrf.enabled=false
springdoc.swagger-ui.supported-submit-methods=get,post,put,delete,patch,options,head



