services:
  pooler-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: hoppo/pooler-backend:staging
    container_name: hoppo-pooler-backend-staging
    restart: unless-stopped
    env_file:
      - ./scripts/aws-staging.env
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SERVER_PORT: 8080
      DB_DDL_AUTO: validate
      LOG_PATH: /var/log/hoppo/pooler-backend
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - hoppo-staging-logs:/var/log/hoppo/pooler-backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/pooler-backend/api/v1/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  hoppo-staging-logs:
    driver: local
